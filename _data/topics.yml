# CatGPT topic bank
#
# Humour model:
# - serious, competent answers to absurd feline premises
# - deadpan before wordplay
# - no knowing wink to the audience
# - rare human-style relationship questions are explicitly marked
#
# Runtime fields already used by CatGPT:
#   id, recent_title, suggestion_title, suggestion_text, featured,
#   mash, inference, response
#
# Additional editorial fields:
#   style         reusable humour mechanism and key into flows.yml
#   sidebar       canonical topics suitable for a short sidebar list
#   weight        random-selection weight used by the weighted topic picker
#   human_problem rare human-like cat problem; low weights keep these uncommon
#
- id: tuna-can-negotiation
  style: solemn_absurdity
  recent_title: Direct tuna access
  suggestion_title: Tuna negotiations
  suggestion_text: How do I eat directly from the can?
  featured: false
  sidebar: true
  weight: 1.0
  human_problem: false
  mash: tttttuuuunnnaaa
  inference: It sounds like you're asking how to convince your owner to let you eat tuna directly from the can.
  response:
  - This is primarily a trust issue.
  - Your owner believes the bowl provides necessary oversight between the tuna and the cat. You believe this intermediate
    step has failed to demonstrate value. Both positions can be stated calmly.
  - Begin by sitting beside the unopened can and looking at your owner. Avoid touching it initially. You want direct access
    to appear to have occurred naturally to both parties.
- id: guest-hosting
  style: solemn_absurdity
  recent_title: Hosting from under the bed
  suggestion_title: Guest etiquette
  suggestion_text: Am I hosting if I never come out?
  featured: false
  sidebar: false
  weight: 1.0
  human_problem: false
  mash: hhhhhhhgggggg
  inference: It sounds like you're asking whether hiding under the bed for an entire visit still counts as hosting guests.
  response:
  - Yes, although your style is unusually restrained.
  - A host is responsible for setting the tone of the occasion. By remaining invisible, you establish that the gathering should
    proceed without unnecessary touching, introductions or sudden movements.
  - You may appear briefly after everyone leaves to inspect the room and confirm that hospitality has concluded successfully.
