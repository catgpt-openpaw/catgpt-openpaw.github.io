- id: closed-door-paradox
  style: elegant_domestic_overstatement
  recent_title: The closed-door paradox
  suggestion_title: Closed-door relations
  suggestion_text: What should I do about a closed door?
  featured: false
  sidebar: true
  weight: 1.0
  human_problem: false
  mash: mmmmmmnnnnnn
  inference: It sounds like you're asking what to do about a closed door.
  response:
  - The door should be opened immediately.
  - A closed interior door represents an unfortunate suspension of normal relations between the rooms. Stand beside it and
    make your objection clear until access is restored.
  - Once it opens, you are under no obligation to pass through. Access is the principle at issue, not travel.
