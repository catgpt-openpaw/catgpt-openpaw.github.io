url: "https://catgpt-openpaw.github.io"
baseurl: ""
repository: "catgpt-openpaw/catgpt-openpaw.github.io"
permalink: pretty
title: "CatGPT"
description: "A static Jekyll experiment in feline interface design and deadpan conversation."

sass:
  style: compressed

plugins:
  - jekyll-environment-variables
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
